[package]
name = "ctdozlite"
version = "0.2.0"
edition = "2021"
authors = ["TIPC1110 <tienichpc1110@gmail.com>"]
description = "Lightweight, high-performance native Zalo PC client written in Rust (zero Node.js, zero Electron)"
homepage = "https://github.com/minhkhang1008/ctdozlite"
repository = "https://github.com/minhkhang1008/ctdozlite"
license = "MIT OR Apache-2.0"
default-run = "ctdozlite"

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
flate2 = "1"
generic-array = "0.14"
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
opus = "0.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rsa = "0.9.10"
lzma-rs = "0.3.0"
zstd = "0.14.3"
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "std", "anyhow"] }
getrandom = { version = "0.3", features = ["std"] }
rustybuzz = "0.20"
memmap2 = "0.9"

# macOS clipboard image paste: same versions winit 0.30 already pulls in (no new crates).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.2", features = ["block2", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep", "NSScreen"] }

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "ctdozlite"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "probe_media"
path = "src/bin/probe_media.rs"

[[bin]]
name = "test_fetch"
path = "src/bin/test_fetch.rs"

[[bin]]
name = "test_qr_tag"
path = "src/bin/test_qr_tag.rs"

[[bin]]
name = "call_probe"
path = "src/bin/call_probe.rs"

[[bin]]
name = "view_feed"
path = "src/bin/view_feed.rs"

[package.metadata.deb]
name = "ctdozlite"
maintainer = "TIPC1110 <tienichpc1110@gmail.com>"
copyright = "2026, TIPC1110 <tienichpc1110@gmail.com>"
license-file = ["LICENSE-MIT", "0"]
depends = "libc6 (>= 2.31), libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1"
recommends = "ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core"
section = "net"
priority = "optional"
assets = [
    ["target/release/ctdozlite", "usr/bin/", "755"],
    ["packaging/linux/ctdozlite", "usr/bin/", "755"],
    ["packaging/linux/ctdozlite.desktop", "usr/share/applications/", "644"],
    ["src/assets/app_icon.png", "usr/share/icons/hicolor/256x256/apps/ctdozlite.png", "644"],
    ["README.md", "usr/share/doc/ctdozlite/README.md", "644"],
]

[profile.release]
# Preserve PE debug/symbol metadata on Windows MSVC builds so unsigned binaries and
# Inno Setup installers do not trigger Microsoft Defender's stripped-PE ML heuristics (#58).
# Linux release jobs run `strip` explicitly in CI.
strip = "none"

[profile.dev]
debug = 0

[profile.test]
debug = 0
